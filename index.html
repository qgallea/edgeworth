<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#193c35">
  <meta name="description" content="An interactive Edgeworth box for exploring exchange, Pareto efficiency and market-clearing prices.">
  <title>The Edgeworth box · Exchange Lab</title>
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script src="./model.js" defer></script>
  <script src="./chart.js" defer></script>
  <script src="./guide.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2.5-10-1v14c4-1.5 7-1 10 1 3-2 6-2.5 10-1V5c-4-1.5-7-1-10 1Zm0 0v14"/></symbol>
    <symbol id="stack" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="exchange" viewBox="0 0 24 24"><path d="M3 8h16m-4-4 4 4-4 4m6 4H5m4-4-4 4 4 4"/></symbol>
    <symbol id="curve" viewBox="0 0 24 24"><path d="M3 3v18h18M6 16c6 0 8-3 13-13M6 6c2 8 6 10 14 10"/></symbol>
    <symbol id="price" viewBox="0 0 24 24"><path d="M3 20V4m0 16h18M6 6l13 11"/><circle cx="13" cy="12" r="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="sliders" viewBox="0 0 24 24"><path d="M3 7h6m5 0h7M3 17h10m5 0h3"/><circle cx="11.5" cy="7" r="2.5"/><circle cx="15.5" cy="17" r="2.5"/></symbol>
    <symbol id="reset-icon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .5 6M4 4v6h6"/></symbol>
    <symbol id="pointer" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 7-4-18Z"/></symbol>
    <symbol id="insight" viewBox="0 0 24 24"><path d="M9 18c0-3-4-4-4-8a7 7 0 0 1 14 0c0 4-4 5-4 8Zm1 3h4"/></symbol>
    <symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m6 0h5v-5"/></symbol>
  </svg>
  <header class="masthead">
    <div class="shell mast-inner">
      <div class="brand"><img src="./mark.svg" alt="" width="31" height="31"><span>Exchange Lab</span></div>
      <span class="course">Économie I</span>
      <div class="header-actions">
        <button id="classroom" class="guide-launch" aria-pressed="false"><svg class="icon"><use href="#expand"/></svg><span>Classroom view</span></button>
        <button id="guide-open" class="guide-launch"><svg class="icon"><use href="#book"/></svg><span data-i="guide">Learning guide</span></button>
        <div class="languages" role="group" aria-label="Language / Langue">
          <button type="button" id="en" lang="en" aria-label="English" aria-pressed="true">EN</button><button type="button" id="fr" lang="fr" aria-label="Français" aria-pressed="false">FR</button>
        </div>
      </div>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <div><h1 data-i="title">The Edgeworth box</h1><p data-i="lead">Two people share two goods. Which trades would they both accept?</p></div>
      <div class="scenario-wrap">
        <label for="scenario" class="mini-label" data-i="scenario">Scenario</label>
        <div class="select-wrap"><svg class="icon"><use href="#stack"/></svg><select id="scenario"></select><svg class="icon chevron"><use href="#down"/></svg></div>
      </div>
    </div>
    <nav class="modes" id="mode-nav" aria-label="Topics">
      <button type="button" data-mode="trade" aria-pressed="true"><svg class="icon"><use href="#exchange"/></svg><span data-i="trade">Gains from trade</span></button>
      <button type="button" data-mode="efficiency" aria-pressed="false"><svg class="icon"><use href="#curve"/></svg><span data-i="efficiency">Pareto efficiency</span></button>
      <button type="button" data-mode="prices" aria-pressed="false"><svg class="icon"><use href="#price"/></svg><span data-i="prices">Market prices</span></button>
    </nav>
    <div class="workspace">
      <section class="card diagram">
        <div class="diagram-heading">
          <div><h2 data-i="diagram">Allocation diagram</h2><p id="chart-instruction"></p></div>
          <div class="people-key"><span class="person a">Samuel</span><span class="person b">Romane</span></div>
        </div>
        <div class="canvas"><svg id="chart" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="plot-key" id="plot-key"></div>
        <div class="layer-controls" id="layers" aria-label="Diagram layers"></div>
        <div class="experiment" id="experiment" hidden></div>
        <div class="insight" role="status" aria-atomic="true"><div class="insight-symbol"><svg class="icon"><use href="#insight"/></svg></div><div><h3 id="finding"></h3><p id="explanation"></p></div></div>
      </section>
      <aside class="controls">
        <section class="card settings">
          <div class="section-heading"><h2><svg class="icon heading-icon"><use href="#sliders"/></svg><span data-i="settings">Economy settings</span></h2><button class="reset" id="reset"><svg class="icon"><use href="#reset-icon"/></svg><span data-i="reset">Reset</span></button></div>
          <div class="settings-body">
            <div class="segmented" id="settings-nav" role="group">
              <button type="button" data-pane="endowments" aria-pressed="true" data-i="endowments">Endowments</button>
              <button type="button" data-pane="preferences" aria-pressed="false" data-i="preferences">Preferences</button>
            </div>
            <div id="parameters"></div>
          </div>
        </section>
        <section class="card readout">
          <div class="section-heading"><h2 id="table-title">Test allocation</h2><span class="math-tag" id="table-symbol" aria-hidden="true">T</span></div>
          <div id="table-wrap"></div>
        </section>
      </aside>
    </div>
    <details class="model-note" id="model-note"><summary><svg class="icon"><use href="#book"/></svg><span data-i="modelNote">Model and assumptions</span><svg class="icon chevron"><use href="#down"/></svg></summary><div id="model-content"></div></details>
  </main>
  <noscript>Enable JavaScript to use the interactive box. Activez JavaScript pour utiliser la boîte interactive.</noscript>
</body>
</html>
